<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{pageTitle}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="{{siteName}}">
  <meta property="og:title" content="{{pageTitle}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{ogImage}}">
  <meta property="article:published_time" content="{{published}}">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#131315">
  <link rel="icon" type="image/svg+xml" href="{{base}}icons/logo.svg">
  {{prefetch}}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Spectral:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{base}}css/style.css">
  <script>
    // Apply the saved sidebar state before first paint (mirrors js/sidebar.js).
    (function () {
      var s = matchMedia('(min-width: 900px)').matches ? 'open' : 'closed';
      try { if (s === 'open' && localStorage.getItem('sss-sidebar') === 'closed') s = 'closed'; } catch (e) {}
      document.documentElement.dataset.sidebar = s;
      var t = 'dark';
      try { if (localStorage.getItem('sss-theme') === 'light') t = 'light'; } catch (e) {}
      document.documentElement.dataset.theme = t;
      if (t === 'light') document.querySelector('meta[name="theme-color"]').content = '#faf8f3';
    })();
  </script>
  <script type="module" src="{{base}}js/main.js"></script>
</head>
<body>
  <script src="{{parent}}topbar.js" data-home="{{parent}}"></script>
  <template id="topbar-extras">
    <a class="nav-site" href="{{base}}"><img src="{{base}}icons/logo.svg" alt=""><span>{{siteName}}</span></a>
    <button class="nav-theme" type="button" data-theme-toggle aria-label="Dark mode" title="Dark mode"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20.9955 11.7115L22.2448 11.6721C22.2326 11.2847 22.0414 10.9249 21.7272 10.698C21.413 10.4711 21.0113 10.4029 20.6397 10.5132L20.9955 11.7115ZM12.2885 3.00454L13.4868 3.36028C13.5971 2.98873 13.5289 2.58703 13.302 2.2728C13.0751 1.95857 12.7153 1.76736 12.3279 1.75516L12.2885 3.00454ZM20.6397 10.5132C20.1216 10.667 19.5716 10.75 19 10.75V13.25C19.815 13.25 20.6046 13.1314 21.3512 12.9098L20.6397 10.5132ZM19 10.75C15.8244 10.75 13.25 8.17564 13.25 5H10.75C10.75 9.55635 14.4437 13.25 19 13.25V10.75ZM13.25 5C13.25 4.42841 13.333 3.87841 13.4868 3.36028L11.0902 2.64879C10.8686 3.39542 10.75 4.18496 10.75 5H13.25ZM12 4.25C12.0834 4.25 12.1665 4.25131 12.2492 4.25392L12.3279 1.75516C12.219 1.75173 12.1097 1.75 12 1.75V4.25ZM4.25 12C4.25 7.71979 7.71979 4.25 12 4.25V1.75C6.33908 1.75 1.75 6.33908 1.75 12H4.25ZM12 19.75C7.71979 19.75 4.25 16.2802 4.25 12H1.75C1.75 17.6609 6.33908 22.25 12 22.25V19.75ZM19.75 12C19.75 16.2802 16.2802 19.75 12 19.75V22.25C17.6609 22.25 22.25 17.6609 22.25 12H19.75ZM19.7461 11.7508C19.7487 11.8335 19.75 11.9166 19.75 12H22.25C22.25 11.8903 22.2483 11.781 22.2448 11.6721L19.7461 11.7508Z" fill="currentColor"/></svg></button>
  </template>
  <script>
    // Add the site logo + title and the theme button to the shared topbar.
    (function () {
      var inner = document.querySelector('#nav .nav-inner');
      var extras = document.getElementById('topbar-extras');
      if (!inner || !extras) return;
      var site = extras.content.querySelector('.nav-site');
      var theme = extras.content.querySelector('.nav-theme');
      theme.setAttribute('aria-pressed', String(document.documentElement.dataset.theme !== 'light'));
      inner.insertBefore(site, inner.children[1]);
      inner.insertBefore(theme, inner.querySelector('.nav-about'));
    })();
  </script>
  {{sidebar}}

  <main class="reader">
    <article class="story">
      <header class="story-head">
        <time class="story-date" datetime="{{iso}}">{{dateLong}}</time>
        <h1 class="story-title">{{title}}</h1>
        <p class="story-meta">{{meta}}</p>
      </header>
      <div class="story-body">
{{body}}
      </div>
    </article>
    {{pager}}
  </main>
</body>
</html>
